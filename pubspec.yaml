name: do_hieu_nang_tram
description: Ứng dụng Đo Hiệu Năng Trạm - Module đo lường thời gian pha chế & xử lý đơn hàng trong hệ sinh thái Trạm
publish_to: 'none'
version: 1.0.2+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.3.0

  # Typography & Design
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1

  # Excel Processing & Sharing
  excel: ^4.0.6
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  universal_html: ^2.2.4

  # Utilities
  intl: any
  equatable: ^2.0.5
  uuid: ^4.4.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
